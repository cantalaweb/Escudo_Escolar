[project]
name = "escudo-escolar"
version = "0.1.0"
description = "Sistema de detección temprana de bullying escolar con IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data Science & ML (para notebooks y modelo)
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "xgboost>=3.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[tool.uv.workspace]
members = ["backend"]

[tool.pytest.ini_options]
pythonpath = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
