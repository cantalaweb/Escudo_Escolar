[project]
name = "escudo-escolar-backend"
version = "2.0.0"
description = "Backend API para Escudo Escolar - Sistema de detección de bullying"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    # AI/ML (OpenAI, LangChain)
    "openai>=1.59.5",
    "langchain>=0.3.13",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.59",
    # Utilities
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",  # Para testing de FastAPI
    "ruff>=0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
